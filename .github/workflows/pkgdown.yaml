# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6h ceiling. Dependency install has
    # hung three times (2026-08-19), each burning 6h and — via the concurrency
    # group below — blocking every later push. Fail fast and re-run instead.
    timeout-minutes: 30
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # Nestimate is published on the author's r-universe, not CRAN.
          extra-repositories: https://mohsaqr.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # true, not the r-lib default of false: 1.1.0 dropped functions that
          # existed in 0.1.0 (complexity, detect_regimes, build_network, ...),
          # and a non-clean deploy leaves their pages live on the site.
          clean: true
          branch: gh-pages
          folder: docs
