url: https://pak.dynasite.org/tsn

template:
  bootstrap: 5
  bootswatch: journal

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Time-series networks
  desc: >
    The construction surface — every exported verb on one series, and the
    plotting system end to end.
  contents:
  - constructing-time-series-networks
  - plotting-time-series-networks

- title: Transition-network modelling with Nestimate
  desc: >
    From raw series to tested transition models — the complete workflow, one
    network per condition, and the verb-by-verb compatibility map.
  contents:
  - nestimate-workflow
  - group-models
  - nestimate-compatibility

reference:
- title: Package
  contents:
  - tsn-package

- title: Network construction
  desc: >
    Build distance, visibility, and state-transition networks from one or
    many univariate time series.
  contents:
  - tsn
  - vg

- title: Discretization and trends
  desc: >
    Turn continuous measurements into states, and classify the direction of
    change between consecutive observations.
  contents:
  - discretize
  - trend

- title: Nestimate bridge
  desc: >
    Discretize a series and hand it to the matching Nestimate
